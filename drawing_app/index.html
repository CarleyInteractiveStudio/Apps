<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Dibujo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>App de Dibujo</h1>
        <p>Crea tus propias ilustraciones y animaciones.</p>
    </header>

    <div class="toolbar">
        <div class="tool">
            <label for="color-picker">Color:</label>
            <div id="color-palette">
                <div class="color-option" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-option" style="background-color: #ff0000;" data-color="#ff0000"></div>
                <div class="color-option" style="background-color: #00ff00;" data-color="#00ff00"></div>
                <div class="color-option" style="background-color: #0000ff;" data-color="#0000ff"></div>
                <div class="color-option" style="background-color: #ffff00;" data-color="#ffff00"></div>
                <div class="color-option" style="background-color: #ffffff;" data-color="#ffffff"></div>
            </div>
        </div>
        <div class="tool">
            <label for="brush-size">Tamaño:</label>
            <input type="range" id="brush-size" min="1" max="50" value="5">
        </div>
        <div class="tool tool-group">
            <button id="pencil-tool" class="tool-button active" data-tool="pencil">Lápiz</button>
            <button id="eraser-tool" class="tool-button" data-tool="eraser">Borrador</button>
            <button id="line-tool-btn" class="tool-button" data-tool="line">Línea</button>
            <button id="rect-tool-btn" class="tool-button" data-tool="rect">Rectángulo</button>
            <button id="circle-tool-btn" class="tool-button" data-tool="circle">Círculo</button>
        </div>
        <div class="tool">
             <button id="clear-canvas" class="tool-button danger">Limpiar Capa</button>
        </div>
            <div class="tool-separator"></div>
            <div class="tool">
                <button id="save-project-btn" class="tool-button">Guardar</button>
                <label for="open-project-input" id="open-project-btn" class="tool-button">Abrir</label>
                <input type="file" id="open-project-input" accept=".cea" style="display: none;">
            </div>
            <div class="tool-separator"></div>
            <div class="tool">
                <button id="zoom-out-btn" class="tool-button">-</button>
                <button id="zoom-reset-btn" class="tool-button">100%</button>
                <button id="zoom-in-btn" class="tool-button">+</button>
            </div>
    </div>

    <div id="editor-container">
        <main id="app-container">
            <div id="canvas-container">
                <!-- Canvases for each layer will be dynamically added here by JavaScript -->
        </div>

        <div id="layer-panel">
            <div class="layer-panel-header">
                <h3>Capas</h3>
                <button id="add-layer-btn" class="tool-button">+</button>
            </div>
            <ul id="layer-list">
                <!-- Layer items will be dynamically added here -->
            </ul>
        </div>
        </main>

        <div id="timeline-panel">
            <div id="timeline-controls">
                <button id="play-btn" class="tool-button">▶</button>
                <button id="stop-btn" class="tool-button">■</button>
                <div class="tool-separator"></div>
                <button id="add-frame-btn" class="tool-button">+ Frame</button>
                <button id="duplicate-frame-btn" class="tool-button">Duplicar</button>
                <button id="delete-frame-btn" class="tool-button danger">- Frame</button>
                <div class="tool-separator"></div>
                <button id="onion-skin-btn" class="tool-button">🧅</button>
                <div class="tool-separator"></div>
                <label for="fps-input">FPS:</label>
                <input type="number" id="fps-input" value="12" min="1" max="60">
            </div>
            <div id="frame-track">
                <!-- Frame thumbnails will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
